display:
  - id: main_display
    platform: mipi_spi
    model: JC3248W535
    data_rate: 40MHz
    rotation: 0
    update_interval: never
    auto_clear_enabled: true

    lambda: |-
      auto t = id(sntp_time).now();
      bool time_ok = t.is_valid();

      Color c_white = Color::WHITE;
      Color c_gray = Color(150, 150, 150);
      Color c_dark_gray = Color(50, 50, 50);
      Color c_orange = Color(255, 140, 70);
      Color c_blue_cold = Color(100, 150, 220);
      Color c_green = Color(100, 200, 100);
      Color c_button_bg = Color(30, 30, 30);
      Color c_button_border = Color(60, 60, 60);
      Color c_box_border = Color(100, 100, 100);

      float temp_curenta = id(temp_ds18b20).state;
      bool is_off = (id(termostat).mode == CLIMATE_MODE_OFF);
      float effective_target = id(mod_vacanta) ? id(temp_vacanta) : id(target_temp);

      auto temp_display = [&](float temp_c) -> float {
        return id(unitate_fahrenheit) ? (temp_c * 9.0f / 5.0f + 32.0f) : temp_c;
      };
      auto unit_str = [&]() -> const char* {
        return id(unitate_fahrenheit) ? "F" : "C";
      };

      auto draw_settings = [&](int start_x) {
        it.filled_rectangle(start_x, 0, 320, 480, Color::BLACK);
        it.print(start_x + 160, 15, id(font_setari_title), c_white, TextAlign::TOP_CENTER, "SETĂRI");
        it.line(start_x + 20, 60, start_x + 300, 60, c_gray);
        int row_y = 80;
        int row_h = 40;

        it.print(start_x + 20, row_y + 10, id(font_setari_label), c_gray, TextAlign::TOP_LEFT, "Unitate");
        it.filled_rectangle(start_x + 180, row_y, 120, 30, c_button_bg);
        it.rectangle(start_x + 180, row_y, 120, 30, c_button_border);
        it.print(start_x + 240, row_y + 15, id(font_setari_btn), c_white, TextAlign::CENTER, id(draft_unitate_fahrenheit) ? "Fahrenheit" : "Celsius");

        row_y += row_h;
        it.print(start_x + 20, row_y + 10, id(font_setari_label), c_gray, TextAlign::TOP_LEFT, "Calibrare");
        {
          float o_disp = id(draft_unitate_fahrenheit) ? (id(draft_offset) * 9.0f / 5.0f) : id(draft_offset);
          if (fabsf(o_disp) < 0.005f) o_disp = 0.0f;
          char buf[16];
          if (id(draft_unitate_fahrenheit)) {
            snprintf(buf, sizeof(buf), "%.2f°F", o_disp);
          } else {
            snprintf(buf, sizeof(buf), "%.1f°C", o_disp);
          }
          it.print(start_x + 160, row_y + 8, id(font_setari_label), c_white, TextAlign::TOP_CENTER, buf);
        }
        it.filled_rectangle(start_x + 210, row_y, 30, 30, c_button_bg);
        it.rectangle(start_x + 210, row_y, 30, 30, c_button_border);
        it.print(start_x + 225, row_y + 15, id(font_setari_btn), c_white, TextAlign::CENTER, "-");
        it.filled_rectangle(start_x + 250, row_y, 30, 30, c_button_bg);
        it.rectangle(start_x + 250, row_y, 30, 30, c_button_border);
        it.print(start_x + 265, row_y + 15, id(font_setari_btn), c_white, TextAlign::CENTER, "+");

        row_y += row_h;
        it.print(start_x + 20, row_y + 10, id(font_setari_label), c_gray, TextAlign::TOP_LEFT, "Histerezis");
        {
          float h_disp = id(draft_unitate_fahrenheit) ? (id(draft_hysteresis) * 9.0f / 5.0f) : id(draft_hysteresis);
          char buf[16];
          snprintf(buf, sizeof(buf), "%.2f°%s", h_disp, id(draft_unitate_fahrenheit) ? "F" : "C");
          it.print(start_x + 160, row_y + 8, id(font_setari_label), c_white, TextAlign::TOP_CENTER, buf);
        }
        it.filled_rectangle(start_x + 210, row_y, 30, 30, c_button_bg);
        it.rectangle(start_x + 210, row_y, 30, 30, c_button_border);
        it.print(start_x + 225, row_y + 15, id(font_setari_btn), c_white, TextAlign::CENTER, "-");
        it.filled_rectangle(start_x + 250, row_y, 30, 30, c_button_bg);
