esphome:
  name: termostat-esphome
  platformio_options:
    upload_speed: 921600
    board_build.flash_mode: dio
    board_build.f_flash: 80000000L
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            if (id(luminozitate) > 100) id(luminozitate) = 100;
            if (id(luminozitate) < 10) id(luminozitate) = 10;
            id(gpio_backlight_pwm).set_level(id(luminozitate) / 100.0f);

            if (isnan(id(target_temp))) id(target_temp) = 23.0f;
            if (id(target_temp) > 28.0f) id(target_temp) = 28.0f;
            if (id(target_temp) < 5.0f) id(target_temp) = 5.0f;

            if (isnan(id(temp_vacanta)) || id(temp_vacanta) < 5.0f || id(temp_vacanta) > 20.0f) id(temp_vacanta) = 15.0f;
            if (isnan(id(hysteresis)) || id(hysteresis) < 0.1f || id(hysteresis) > 2.0f) id(hysteresis) = 0.3f;
            if (id(min_time_sec) < 0 || id(min_time_sec) > 600) id(min_time_sec) = 180;

            if (isnan(id(offset_salvat)) || id(offset_salvat) < -5.0f || id(offset_salvat) > 5.0f) id(offset_salvat) = 0.0f;
            id(offset_temp) = id(offset_salvat);

            id(last_heating_change) = millis();

            ESP_LOGI("boot", "Sistem pornit. Temp tinta din memorie: %.2f°C, luminozitate: %d%%", id(target_temp), id(luminozitate));
    - priority: -100
      then:
        - lambda: |-
            id(luminozitate_nr).publish_state(id(luminozitate));
            id(offset_nr).publish_state(id(offset_temp));

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      compiler_optimization: SIZE
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 40MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    ssid: !secret ap_ssid
    password: !secret ap_password

captive_portal:

logger:

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

one_wire:
  - platform: gpio
    pin: GPIO17

sensor:
  - platform: dallas_temp
    name: "Temperatura Cameră"
    id: temp_ds18b20
    update_interval: 15s
    resolution: 12
    accuracy_decimals: 2
    filters:
      - lambda: |-
          if (x == 85.0f || x < -50.0f) return {};
          return x;
      - lambda: 'return x + id(offset_temp);'
    on_raw_value:
      then:
        - lambda: |-
            if (x != 85.0f && x > -50.0f) id(temp_raw).publish_state(x);
    on_value:
      then:
        - lambda: 'id(last_temp_ms) = millis();'

  - platform: wifi_signal
    name: "WiFi Signal RSSI"
    id: wifi_signal_db
    update_interval: 60s

  - platform: template
    name: "Temperatura Brută"
    id: temp_raw
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic

binary_sensor:
  - platform: template
    name: "Încălzire Activă"
    device_class: heat
    lambda: 'return id(heating_active);'

number:
  - platform: template
    name: "Luminozitate Display"
    id: luminozitate_nr
    icon: mdi:brightness-6
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 1
    mode: slider
    optimistic: true
    restore_value: false
    set_action:
      - lambda: |-
          int v = (int) x;
          id(gpio_backlight_pwm).set_level(v / 100.0f);
          id(draft_luminozitate) = v;
      - script.execute:
          id: salveaza_luminozitate
          val: !lambda 'return (int) x;'

  - platform: template
    name: "Calibrare Temperatură"
    id: offset_nr
    icon: mdi:thermometer-plus
    unit_of_measurement: "°C"
    min_value: -5.0
    max_value: 5.0
    step: 0.1
    mode: box
    optimistic: true
    restore_value: false
    set_action:
      - lambda: |-
          float v = roundf(x * 10.0f) / 10.0f;
          id(offset_temp) = v;
          id(draft_offset) = v;
      - script.execute:
          id: salveaza_offset
          val: !lambda 'return roundf(x * 10.0f) / 10.0f;'
      - lambda: 'id(temp_ds18b20).update();'

script:
  - id: salveaza_luminozitate
    mode: restart
    parameters:
      val: int
    then:
      - delay: 3s
      - lambda: |-
          if (id(luminozitate) != val) id(luminozitate) = val;

  - id: salveaza_offset
    mode: restart
    parameters:
      val: float
    then:
      - delay: 3s
      - lambda: |-
          if (fabsf(id(offset_salvat) - val) > 0.001f) id(offset_salvat) = val;

  - id: animatie_schimbare_pagina
    mode: restart
    parameters:
      target_state: bool
    then:
      - lambda: |-
          id(animating) = true;
          id(anim_target_page) = target_state;
          id(anim_start_ms) = millis();
          id(main_display).update();

output:
  - id: gpio_backlight_pwm
    platform: ledc
    pin: 1
    frequency: 20000 Hz
  - platform: gpio
    pin: GPIO18
    id: releu_output

switch:
  - platform: output
    name: "Releu Centrală"
    id: releu
    output: releu_output
    restore_mode: ALWAYS_OFF
    internal: true

climate:
  - platform: thermostat
    id: termostat
    name: "Termostat Cameră"
    sensor: temp_ds18b20
    min_heating_off_time: 0s
    min_heating_run_time: 0s
    min_idle_time: 0s
    visual:
      min_temperature: 5.0
      max_temperature: 28.0
      temperature_step:
        target_temperature: 0.5
        current_temperature: 0.01
    preset:
      - name: "Manual"
        default_target_temperature_low: 23.0
        mode: "heat"
    default_preset: "Manual"
    on_boot_restore_from: memory
    heat_action:
      - logger.log: "Climate: Heat action (ignorat)"
    idle_action:
      - logger.log: "Climate: Idle action (ignorat)"
    off_mode:
      - logger.log: "Climate: Off mode"

globals:
  # =========================================================================
  # SETĂRI PENTRU ANIMAȚIE
  # =========================================================================
  - id: anim_duration_ms
    type: int
    restore_value: no
    initial_value: '500'
    
  - id: anim_fps
    type: int
    restore_value: no
    initial_value: '40'  # Modificat pentru stabilitatea magistralei SPI (maximul ecranului JC3248W535)
  # =========================================================================

  - id: target_temp
    type: float
    restore_value: yes
    initial_value: '23.0'
  - id: mod_vacanta
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: temp_vacanta
    type: float
    restore_value: yes
    initial_value: '15.0'
  - id: hysteresis
    type: float
    restore_value: yes
    initial_value: '0.3'
  - id: min_time_sec
    type: int
    restore_value: yes
    initial_value: '180'
  - id: unitate_fahrenheit
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: luminozitate
    type: int
    restore_value: yes
    initial_value: '100'
  - id: offset_salvat
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: offset_temp
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: draft_mod_vacanta
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: draft_temp_vacanta
    type: float
    restore_value: no
    initial_value: '15.0'
  - id: draft_hysteresis
    type: float
    restore_value: no
    initial_value: '0.3'
  - id: draft_min_time_sec
    type: int
    restore_value: no
    initial_value: '180'
  - id: draft_unitate_fahrenheit
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: draft_luminozitate
    type: int
    restore_value: no
    initial_value: '100'
  - id: draft_offset
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: heating_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: last_heating_change
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_temp_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: touch_x
    type: int
    restore_value: no
    initial_value: '0'
  - id: touch_y
    type: int
    restore_value: no
    initial_value: '0'
  - id: touch_activ
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: pagina_setari
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: animating
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: anim_target_page
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: anim_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

preferences:
  id: prefs
  flash_write_interval: 10s

spi:
  - type: quad
    clk_pin: 47
    data_pins: [21, 48, 40, 39]

i2c:
  - sda: 4
    scl: 8

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Bucharest

interval:
  - interval: 1s
    then:
      - lambda: |-
          float temp = id(temp_ds18b20).state;
          bool is_off = (id(termostat).mode == CLIMATE_MODE_OFF);
          float target = id(mod_vacanta) ? id(temp_vacanta) : id(target_temp);
          bool stale = (uint32_t) (millis() - id(last_temp_ms)) > 180000UL;

          if (millis() < 5000) {
            auto call = id(termostat).make_call();
            call.set_target_temperature(target);
            call.perform();
          } else {
            float ha = id(termostat).target_temperature;
            if (!isnan(ha)) {
              float lo = 5.0f;
              float hi = id(mod_vacanta) ? 20.0f : 28.0f;
              float v = fmaxf(lo, fminf(hi, ha));
              if (id(mod_vacanta)) {
                if (fabsf(v - id(temp_vacanta)) > 0.01f) id(temp_vacanta) = v;
              } else {
                if (fabsf(v - id(target_temp)) > 0.01f) id(target_temp) = v;
              }
              if (fabsf(v - ha) > 0.01f) {
                auto call = id(termostat).make_call();
                call.set_target_temperature(v);
                call.perform();
              }
            }
          }

          if (is_off || isnan(temp) || stale) {
            if (id(heating_active)) {
              id(heating_active) = false;
              id(releu).turn_off();
              id(last_heating_change) = millis();
              ESP_LOGW("termostat", "Releu oprit (mod OFF, senzor indisponibil sau blocat)");
            }
            return;
          }

          float diff = target - temp;
          uint32_t now_ms = millis();
          uint32_t elapsed_s = (now_ms - id(last_heating_change)) / 1000;
          
          // Histerezis corectat pentru a reprezenta fluctuația totală (± jumătate din valoare)
          float half_hyst = id(hysteresis) / 2.0f;

          if (!id(heating_active)) {
            if (diff > half_hyst && elapsed_s >= (uint32_t) id(min_time_sec)) {
              id(heating_active) = true;
              id(last_heating_change) = now_ms;
              id(releu).turn_on();
            }
          } else {
            if (diff < -half_hyst && elapsed_s >= (uint32_t) id(min_time_sec)) {
              id(heating_active) = false;
              id(last_heating_change) = now_ms;
              id(releu).turn_off();
            }
          }

  # Interval consolidat pentru managementul ecranului (unifică fostul 80ms cu cel de 2ms)
  - interval: 16ms
    then:
      - lambda: |-
          static uint32_t last_draw = 0;
          uint32_t now = millis();
          
          if (id(animating)) {
            // Limitează la maxim ~40 FPS (25ms) pentru stabilitate SPI
            uint32_t target_interval = (id(anim_fps) > 0) ? (1000UL / (uint32_t)id(anim_fps)) : 25UL;
            if (target_interval < 25) target_interval = 25; // protecție hardware
            
            if (now - last_draw >= target_interval) {
              last_draw = now;
              id(main_display).update();
            }
          } else {
            // Logica pentru starea de repaus sau încălzire
            bool anim_flacara = (id(heating_active) && !id(pagina_setari));
            uint32_t repaus_interval = anim_flacara ? 80UL : 1000UL;
            
            if (now - last_draw >= repaus_interval) {
              last_draw = now;
              id(main_display).update();
            }
          }

